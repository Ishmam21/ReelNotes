[project]
name = "reelnotes-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "yt-dlp>=2025.1",
    "faster-whisper>=1.1,<2",
    "pillow>=11,<13",
    "langchain-google-genai>=2,<5",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "av<19",
    "pwdlib[argon2]>=0.2,<1",
    "email-validator>=2,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
